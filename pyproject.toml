[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarDeltaSolMQTT"
version = "0.1.0"
description = "Publish RESOL DeltaSol BS controller values to MQTT"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Karel Blavka", email = "karel.blavka@gmail.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = [
  "Click>=8.1,<9",
  "click-log>=0.4,<1",
  "schema>=0.7,<1",
  "PyYAML>=6,<7",
  "paho-mqtt>=2.1,<3",
  "pyserial>=3.5,<4",
  "simplejson>=3.19,<5",
]

[project.scripts]
solarDeltaSolMQTT = "solarDeltaSolMQTT:main"

[project.urls]
Homepage = "https://github.com/blavka/solarDeltaSolMQTT"

[tool.setuptools.packages.find]
include = ["solarDeltaSolMQTT*"]
